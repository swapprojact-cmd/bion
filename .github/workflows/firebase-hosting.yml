name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyBYGTaeJ6Jy9KIyjifTNI_8dR7AG35vQJE
          VITE_FIREBASE_AUTH_DOMAIN: ai-studio-applet-webapp-8c041.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ai-studio-applet-webapp-8c041
          VITE_FIREBASE_STORAGE_BUCKET: ai-studio-applet-webapp-8c041.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "981047281108"
          VITE_FIREBASE_APP_ID: "1:981047281108:web:40106933cfa2bf32f1c241"
          VITE_FIRESTORE_DATABASE_ID: ai-studio-bicirclebisexual-7b1ba258-2320-4251-a404-a27b5a1fc949

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Configure Firebase CLI credentials
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::GitHub secret FIREBASE_SERVICE_ACCOUNT is missing."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy Firestore rules, indexes, and Storage rules
        run: firebase deploy --only firestore,storage --project ai-studio-applet-webapp-8c041 --non-interactive

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ai-studio-applet-webapp-8c041
